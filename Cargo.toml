[package]
name = "cyd-weather"
version = "0.1.0"
authors = ["ericman2001"]
edition = "2021"
resolver = "2"
rust-version = "1.77"
license = "GPL-3.0-only"
description = "Weather station firmware for the Cheap Yellow Display (ESP32-2432S028R) using Rust std on ESP-IDF"

[[bin]]
name = "cyd-weather"
harness = false # do not use the built in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "z"

[features]
default = ["std", "esp-idf-svc/native"]

pio = ["esp-idf-svc/pio"]
std = ["esp-idf-svc/binstart", "esp-idf-svc/std"]
alloc = ["esp-idf-svc/alloc"]
nightly = ["esp-idf-svc/nightly"]
experimental = ["esp-idf-svc/experimental"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", default-features = false }
esp-idf-hal = "0.46.2"
esp-idf-sys = "0.37.2"
embedded-svc = "0.29.0"

# Display + graphics
embedded-graphics = "0.8.2"
mipidsi = "0.8.0"
display-interface-spi = "0.5.0"
embedded-hal = "1.0.0"

# Serialization for the weather / geolocation JSON APIs
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"

# Error handling
anyhow = "1.0.104"

# Fixed-capacity collections used on the heap-constrained device
heapless = "0.8.0"

# Raw DEFLATE core for `src/png_stream.rs`. The `png` crate is unusable on this
# target: it grows several 32 KiB zlib buffers on the heap, which fails (and
# aborts) once Wi-Fi is up. Driving the inflate core directly lets us hand it a
# statically reserved window instead.
miniz_oxide = "0.8.9"

[build-dependencies]
embuild = "0.33.2"
